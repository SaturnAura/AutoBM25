name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run cargo tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

  rust-msrv:
    name: Rust MSRV 1.71
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.71.0
      - name: Verify minimum supported Rust version
        run: cargo test --manifest-path rust/Cargo.toml --locked

  python-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-15-intel
            python: "3.9"
          - os: macos-15-intel
            python: "3.12"
          - os: windows-2025
            python: "3.9"
          - os: windows-2025
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      AUTOBM25_SKIP_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pure-Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run pytest
        run: pytest -q

  wheels:
    name: Wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2025
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build platform wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features python
          manylinux: auto
      - name: Install runtime dependencies for wheel test
        run: python -m pip install "numpy>=1.24" "scipy>=1.10" "pyyaml>=6.0" "tqdm>=4.60"
      - name: Verify the built wheel outside the source tree
        run: python tests/wheel_smoke.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
