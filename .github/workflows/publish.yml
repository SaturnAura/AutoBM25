name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2025
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build abi3 platform wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features python
          manylinux: auto
      - name: Install runtime dependencies for wheel test
        run: python -m pip install "numpy>=1.24" "scipy>=1.10" "pyyaml>=6.0" "tqdm>=4.60"
      - name: Verify the release wheel outside the source tree
        run: python tests/wheel_smoke.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Upload release files
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/autobm25/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
