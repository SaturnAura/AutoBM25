[build-system]
# `wheel` provides bdist_wheel for setuptools < 70.1 (newer setuptools bundles it).
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobm25"
version = "0.1.1"
description = "Zero-label BM25 hyperparameter adaptation: O(1) statistical-feature dictionary lookup with heuristic fallback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["bm25", "information-retrieval", "hyperparameter", "zero-shot", "ir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/SaturnAura/AutoBM25"
Repository = "https://github.com/SaturnAura/AutoBM25"
Issues = "https://github.com/SaturnAura/AutoBM25/issues"
Changelog = "https://github.com/SaturnAura/AutoBM25/releases"

[project.scripts]
autobm25 = "autobm25.cli:main"

[tool.setuptools]
packages = ["autobm25"]

[tool.setuptools.package-data]
# The compiled PyO3 extension is optional: the globs simply match nothing when it
# has not been built, in which case the package is a pure-Python `py3-none-any`
# wheel. When it is present the wheel is tagged for this platform instead (see
# setup.py), so pip never installs a binary on a platform that cannot run it.
autobm25 = ["data/*.json", "data/*.txt", "data/*.yaml", "*.pyd", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "."
module-name = "autobm25._autobm25_rs"
features = ["python"]
bindings = "pyo3"
